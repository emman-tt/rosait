name: Build and push

on:
  push:
    branches: [main]

env:
  APP_NAME: "rosait"
  HOST_PORT: "3005"
  CONTAINER_PORT: "3005"
  NGINX_FILE: "rosait-nginx.conf"
  DIR: "/home/ubuntu/apps/rosait"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout and clone repo to runner
        uses: actions/checkout@v4

      - name: Login to github image ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build app into docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy Nginx Config to Server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          port: 22
          key: ${{ secrets.KEY }}
          source: "rosait-nginx.conf" 
          target: "/home/ubuntu/apps/rosait"

      - name: Copy Docker compose  to Server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          port: 22
          key: ${{ secrets.KEY }}
          source: "docker-compose.yml" 
          target: "/home/ubuntu/apps/rosait"

   
      - name: SSH into vm and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          port: 22
          key: ${{ secrets.KEY }}
          envs: APP_NAME,HOST_PORT,CONTAINER_PORT,DIR
          script: |
            cd $DIR
            docker compose pull
            docker compose up -d

     
      - name: Copy nginx configuration, symlink to enable, test and reload host nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          port: 22
          key: ${{ secrets.KEY }}
          envs: APP_NAME,NGINX_FILE
          script: |
            sudo cp $DIR/$NGINX_FILE /etc/nginx/sites-available/$APP_NAME
            sudo ln -sf /etc/nginx/sites-available/$APP_NAME /etc/nginx/sites-enabled/$APP_NAME
            sudo nginx -t
            sudo systemctl reload nginx

  aftermath:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Update repo description
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          APP_NAME: ${{ env.APP_NAME }} 
        run: |
          gh repo edit "${{ github.repository }}" --homepage "https://$APP_NAME.emmanverse.uk"