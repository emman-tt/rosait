name: Build and push

on:
  push:
    branches: [main]

env:
  APP_NAME: "rosait"
  HOST_PORT: "3005"
  CONTAINER_PORT: "3005"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout and clone repo to runner
        uses: actions/checkout@v4

      - name: Login to github image ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build app into docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy Nginx Config to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          port: 22
          key: ${{ secrets.KEY }}
          source: "nginx.conf" 
          target: "/home/ubuntu/deploy/"

   
      - name: SSH into vm and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          port: 22
          key: ${{ secrets.KEY }}
          envs: APP_NAME
          script: |
            docker pull ghcr.io/${{ github.repository }}:latest 
            docker stop $APP_NAME || true 
            echo "$APP_NAME stopped"
            docker rm $APP_NAME  || true 
            echo "$APP_NAME removed"
            docker run -d -p 127.0.0.1:$HOST_PORT:$CONTAINER_PORT \
            --restart unless-stopped \
            --name $APP_NAME ghcr.io/${{ github.repository }}:latest 
            docker logs $APP_NAME

     
      - name: Copy nginx configuration, symlink to enable, test and reload host nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          port: 22
          key: ${{ secrets.KEY }}
          envs: APP_NAME
          script: |
            sudo cp /home/ubuntu/deploy/nginx.conf /etc/nginx/sites-available/$APP_NAME
            sudo ln -sf /etc/nginx/sites-available/$APP_NAME /etc/nginx/sites-enabled/$APP_NAME
            sudo nginx -t
            sudo systemctl reload nginx

  aftermath:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Update repo description
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          APP_NAME: ${{ env.APP_NAME }} 
        run: |
          gh repo edit "${{ github.repository }}" --description "https://$APP_NAME.emmanverse.uk"