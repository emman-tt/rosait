<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
    <!-- ROSÆ brand mark: the hero's 8-petal flower, sized for tiny favicon legs -->
    <rect width="48" height="48" rx="10" fill="#0c0c0e"/>
    <g fill="none" stroke="#ff5ca8" stroke-width="4.5" stroke-linecap="round">
        <ellipse cx="24" cy="12.5" rx="4" ry="8.5" transform="rotate(0 24 24)"/>
        <ellipse cx="24" cy="12.5" rx="4" ry="8.5" transform="rotate(45 24 24)"/>
        <ellipse cx="24" cy="12.5" rx="4" ry="8.5" transform="rotate(90 24 24)"/>
        <ellipse cx="24" cy="12.5" rx="4" ry="8.5" transform="rotate(135 24 24)"/>
        <ellipse cx="24" cy="12.5" rx="4" ry="8.5" transform="rotate(180 24 24)"/>
        <ellipse cx="24" cy="12.5" rx="4" ry="8.5" transform="rotate(225 24 24)"/>
        <ellipse cx="24" cy="12.5" rx="4" ry="8.5" transform="rotate(270 24 24)"/>
        <ellipse cx="24" cy="12.5" rx="4" ry="8.5" transform="rotate(315 24 24)"/>
    </g>
    <circle cx="24" cy="24" r="4" fill="#ff5ca8"/>
</svg>
